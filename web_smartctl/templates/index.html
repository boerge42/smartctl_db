$def with(devices)

$if len(devices) > 0:
    <table>
        <tr>
            <th>computer</th>
            <th>device name</th>
            <th>generation</th>
            <th>created at</th>
            <th></th>
        </tr>
    $for device in devices:
        <tr>
            <td>$device.computer</td>
            <td>$device.device_name</td>
            <td>$device.generation</td>
            <td>$device.created_at</td>
            <td><a href="/details/?computer=$device.computer&device_name=$device.device_name&generation=$device.generation">detail</a></td>
        </tr>  
    </table>  

$else:
    <p>
    ...no devices found!
    </p>
